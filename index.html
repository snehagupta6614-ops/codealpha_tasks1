<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha - Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Header -->
  <header class="gallery-header">
    <h1>Interactive Photo Gallery</h1>
    <p>Explore beautiful imagery filtered by category</p>
  </header>

  <!-- Filter Buttons -->
  <div class="filter-container">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="nature">Nature</button>
    <button class="filter-btn" data-category="architecture">Architecture</button>
    <button class="filter-btn" data-category="travel">Travel</button>
    <button class="filter-btn" data-category="animals">Animals</button>
  </div>

  <!-- Gallery Grid -->
  <main class="gallery-grid" id="galleryGrid">

    <div class="gallery-item" data-category="nature">
      <img src="https://picsum.photos/id/10/800/600" alt="Mountain Lake" loading="lazy" />
      <div class="overlay">
        <h3>Mountain Lake</h3>
        <span>Nature</span>
      </div>
    </div>

    <div class="gallery-item" data-category="architecture">
      <img src="https://picsum.photos/id/42/800/600" alt="Modern Building" loading="lazy" />
      <div class="overlay">
        <h3>Modern Skyscraper</h3>
        <span>Architecture</span>
      </div>
    </div>

    <div class="gallery-item" data-category="travel">
      <img src="https://picsum.photos/id/1036/800/600" alt="Snowy Road" loading="lazy" />
      <div class="overlay">
        <h3>Winter Trail</h3>
        <span>Travel</span>
      </div>
    </div>

    <div class="gallery-item" data-category="animals">
      <img src="https://picsum.photos/id/237/800/600" alt="Black Puppy" loading="lazy" />
      <div class="overlay">
        <h3>Playful Puppy</h3>
        <span>Animals</span>
      </div>
    </div>

    <div class="gallery-item" data-category="nature">
      <img src="https://picsum.photos/id/28/800/600" alt="Forest Pathway" loading="lazy" />
      <div class="overlay">
        <h3>Mist Forest</h3>
        <span>Nature</span>
      </div>
    </div>

    <div class="gallery-item" data-category="architecture">
      <img src="https://picsum.photos/id/1040/800/600" alt="Bridge View" loading="lazy" />
      <div class="overlay">
        <h3>Grand Bridge</h3>
        <span>Architecture</span>
      </div>
    </div>

    <div class="gallery-item" data-category="travel">
      <img src="https://picsum.photos/id/1015/800/600" alt="River Valley" loading="lazy" />
      <div class="overlay">
        <h3>River Valley</h3>
        <span>Travel</span>
      </div>
    </div>

    <div class="gallery-item" data-category="animals">
      <img src="https://picsum.photos/id/1025/800/600" alt="Pug in Blanket" loading="lazy" />
      <div class="overlay">
        <h3>Cozy Pug</h3>
        <span>Animals</span>
      </div>
    </div>

  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <button class="lightbox-prev" id="lightboxPrev"><i class="fa-solid fa-chevron-left"></i></button>
    
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="Enlarged view" />
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <button class="lightbox-next" id="lightboxNext"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
